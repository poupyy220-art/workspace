<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'; img-src 'self' data:; object-src 'none'; base-uri 'none'"><title>BOM 排除與待貼入更新</title><link rel="stylesheet" href="style.css?v=0.1.2"></head><body><main>
<header><span class="tag">本機處理 · 0.1.2</span><h1>BOM 排除與待貼入更新</h1><p>先核對移除範圍，再下載兩份一致的新檔。原始檔保留。</p></header>
<section><h2>1　選擇本批檔案</h2><div class="files"><label>BOM_TREE（必填）<input id="bom" type="file" accept=".xlsx"></label><label>Export_LBS（選填）<input id="export" type="file" accept=".xlsx"></label><label>EC Tracking 待貼入（選填）<input id="staging" type="file" accept=".xlsx"></label></div><label>額外指定排除的 MTM（一行一個；沒有可留空）<textarea id="manual" rows="3" placeholder="貼上 MTM 清單"></textarea></label><label>本批處理日期（用於不需建立的 MTM）<input id="date" type="date"></label><label class="agree"><input id="preserve-unmatched" type="checkbox">保留未對應 BOM 主階的 PN／資料（原列完整保留，不計 MTM，另待人工確認）</label><button id="preview">檢查並預覽</button><p class="hint">Ignore 與已存在 PIM 的 MTM 從重匯 BOM 排除；缺料 MTM 預設保留；明確指定時可排除整包 BOM，但追蹤仍待確認。已存在 PIM 的追蹤狀態仍待確認。待貼入保留全部追蹤列，不自動標記 Upload。</p></section>
<p id="status" role="status" aria-live="polite"></p><section id="result" hidden><h2>2　核對更新內容</h2><div id="totals" class="totals"></div><div id="warnings"></div><div class="scroll"><table><thead><tr><th>MTM</th><th>分類</th><th>BOM 列數</th><th>待貼入更新</th><th>來源原因</th></tr></thead><tbody id="rows"></tbody></table></div><p>未列出的 MTM 不會被排除。EIP 無錯誤只代表本批候選，不代表已完成建立。</p><label class="agree"><input id="agree" type="checkbox">我已核對排除項目、待確認項目與處理日期</label><div class="actions"><button id="build" disabled>產生更新檔案</button><button id="download-bom" hidden>下載 BOM_TREE</button><button id="download-staging" hidden>下載待貼入報表</button></div></section>
<footer>檔案只在此瀏覽器處理，不上傳。不修改公司系統、不寄信。重新選檔或修改條件後需重新預覽。</footer>
</main><script src="../../vendor/jszip-3.10.1.min.js"></script><script src="engine.js?v=0.1.2"></script><script src="ui.js?v=0.1.2"></script></body></html>
