<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>BOM 轉檔與安檢操作 SOP</title>
  <script src="bom-guide.js?v=20260831-1"></script>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f2f6fa;color:#263746;font-family:"Microsoft JhengHei",Arial,sans-serif}.sop-wrap{max-width:980px;margin:auto;padding:28px}.sop-head,.sop-section{background:#fff;border:1px solid #d9e1e8;border-radius:12px;padding:22px;margin-bottom:16px}.sop-head h1{color:#1f497d;margin:0 0 7px}.sop-meta{color:#687a8a;font-size:.86rem}.sop-section h2{font-size:1.05rem;color:#1f497d;margin:0 0 12px}.sop-section li{margin:7px 0;line-height:1.55}.sop-flow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.sop-flow-step{display:flex;align-items:center;gap:7px;background:#eef6fd;padding:10px 12px;border-radius:8px}.sop-flow-step span{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:#2c7fbd;color:#fff}.sop-flow-arrow{color:#7e8f9e;font-weight:bold}.sop-actions{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:16px}.sop-actions button{border:0;border-radius:7px;padding:10px 16px;background:#2c7fbd;color:#fff;font-weight:bold;cursor:pointer}.sop-note{background:#eaf6ee;border-left:4px solid #247a45;padding:11px 13px}.sop-back{background:#607d8b!important}@media(max-width:700px){.sop-wrap{padding:12px}.sop-flow{display:grid;grid-template-columns:1fr}.sop-flow-arrow{transform:rotate(90deg);text-align:center}}@media print{body{background:#fff}.sop-wrap{max-width:none;padding:0}.sop-actions{display:none}.sop-head,.sop-section{break-inside:avoid;box-shadow:none}}
  </style>
</head>
<body>
<main class="sop-wrap">
  <div class="sop-actions"><button class="sop-back" onclick="history.back()">← 返回</button><button onclick="window.print()">列印本頁／另存 SOP PDF</button></div>
  <header class="sop-head"><h1 id="sopTitle">BOM 轉檔與安檢操作 SOP</h1><div id="sopMeta" class="sop-meta"></div></header>
  <section class="sop-section"><h2>操作流程圖</h2><div id="sopFlow" class="sop-flow" aria-label="BOM 操作流程"></div></section>
  <section class="sop-section"><h2>系統優化項目</h2><ul id="sopOptimizations"></ul></section>
  <section class="sop-section"><h2>正確使用步驟</h2><ol id="sopSteps"></ol></section>
  <section class="sop-section"><h2>OneDrive／Excel 檔案處理</h2><ul id="sopOneDriveTips"></ul><div class="sop-note">看到「檔案使用中」時，不需要修改 BOM；請先關閉 Excel，再改用本機副本重新處理。</div></section>
  <section class="sop-section"><h2>結果標記說明</h2><ul id="sopLegend"></ul><div class="sop-note">有 BLOCKER 時請先修正來源 BOM 並重新執行，不建議直接交付 IT。</div></section>
</main>
<script>BomGuide.renderSop();</script>
</body>
</html>
